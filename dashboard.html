<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="لوحة تقدم تعلم الصينية — تنافس في النقاط والمستويات واجمع الإنجازات وتابع إحصاءاتك وسلّم HSK نحو الطلاقة">
<title>لوحة التقدم وسلّم HSK — تعلم الصينية</title>
<link rel="stylesheet" href="common.css">
<script src="progress.js"></script>
<style>
  :root{
    --bg:#f7f5f0; --card:#ffffff; --line:#e6e0d4;
    --txt:#2b2b2b; --muted:#8a8375; --accent:#b5622a; --accent-bg:#fff8ef;
    --gold:#d4af37; --silver:#bdc3c7;
  }
  *{box-sizing:border-box}
  body{
    margin:0; padding:20px 16px 60px; background:var(--bg); color:var(--txt);
    font-family:"Noto Naskh Arabic","Traditional Arabic","Segoe UI",serif;
    line-height:1.6;
  }
  .wrap{max-width:1000px; margin:0 auto}
  .back{display:inline-block; color:var(--muted); text-decoration:none; margin-bottom:10px; font-size:.9rem}
  .back:hover{color:var(--accent)}
  header{text-align:center; margin-bottom:22px}
  h1{margin:0 0 4px; font-size:1.7rem; color:var(--accent)}
  header p{margin:0; color:var(--muted); font-size:.92rem}

  /* شريط تبديل الملفات */
  .profile-switcher{
    display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:22px;
  }
  .profile-pill{
    background:var(--card); border:2px solid var(--line); border-radius:16px;
    padding:12px 16px; cursor:pointer; display:flex; align-items:center; gap:12px;
    transition:all .2s; font-family:inherit;
  }
  .profile-pill:hover{border-color:var(--accent)}
  .profile-pill.active{
    border-color:var(--accent); background:var(--accent-bg);
    box-shadow:0 0 0 3px rgba(181,98,42,.15);
  }
  .pill-avatar{font-size:2rem; line-height:1}
  .pill-info{text-align:right; flex:1}
  .pill-name{font-weight:700; color:var(--txt); font-size:1rem}
  .pill-xp{font-size:.8rem; color:var(--muted)}

  /* بطاقة الملف الحالي */
  .profile-card{
    background:var(--card); border:1px solid var(--line);
    border-radius:22px; padding:26px 22px; margin-bottom:24px;
    display:flex; align-items:center; gap:22px; flex-wrap:wrap;
    justify-content:center;
  }
  .level-ring{position:relative; width:140px; height:140px; flex-shrink:0}
  .level-ring svg{width:100%; height:100%; transform:rotate(-90deg)}
  .level-ring .avatar-center{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:3.8rem; line-height:1;
  }
  .level-badge{
    position:absolute; bottom:-6px; left:50%; transform:translateX(-50%);
    background:var(--accent); color:#fff; border-radius:999px;
    padding:3px 14px; font-weight:700; font-size:.9rem;
    border:3px solid var(--card);
  }
  .profile-info{flex:1; min-width:240px; text-align:right}
  .profile-name{
    margin:0 0 4px; font-size:1.6rem; color:var(--txt);
    padding:4px 8px; border-radius:8px; outline:none;
    border:2px solid transparent; transition:all .2s;
  }
  .profile-name:hover, .profile-name:focus{
    border-color:var(--accent); background:var(--accent-bg);
  }
  .profile-sub{color:var(--muted); font-size:.9rem; margin-bottom:10px}
  .xp-bar{
    height:14px; background:var(--line); border-radius:999px; overflow:hidden;
    margin-bottom:6px;
  }
  .xp-fill{
    height:100%; background:linear-gradient(90deg, #e67e22, #b5622a);
    border-radius:999px; transition:width .5s ease;
  }
  .xp-label{font-size:.85rem; color:var(--muted)}
  .xp-label b{color:var(--accent)}

  /* ═══ قسم سلّم HSK ومحطات الطلاقة ═══ */
  .ladder-card{
    background:var(--card); border:1px solid var(--line);
    border-radius:20px; padding:24px 20px; margin-bottom:24px;
    box-shadow:0 4px 16px rgba(0,0,0,.03);
  }
  .ladder-header{
    display:flex; justify-content:space-between; align-items:center;
    flex-wrap:wrap; gap:12px; margin-bottom:18px;
  }
  .ladder-title{font-size:1.25rem; color:var(--accent); margin:0; font-weight:700; display:flex; align-items:center; gap:8px}
  .ladder-badge{
    background:var(--accent-bg); color:var(--accent);
    padding:6px 14px; border-radius:999px; font-weight:700; font-size:.88rem;
    border:1px dashed var(--accent);
  }
  .ladder-stats-row{
    display:grid; grid-template-columns:repeat(auto-fit, minmax(190px, 1fr));
    gap:12px; margin-bottom:20px;
  }
  .ladder-stat{
    background:#fbf9f4; border:1px solid var(--line); border-radius:14px;
    padding:14px; text-align:center;
  }
  .ladder-stat-val{font-size:1.5rem; font-weight:700; color:var(--accent); line-height:1.2}
  .ladder-stat-lbl{font-size:.82rem; color:var(--muted); margin-top:3px}

  /* السلّم البصري الأفقي المتدرج */
  .ladder-track-wrap{
    overflow-x:auto; padding-bottom:8px; margin-bottom:14px; direction:ltr;
  }
  .ladder-track{
    display:flex; align-items:center; justify-content:space-between;
    min-width:640px; position:relative; padding:26px 12px 14px;
  }
  .ladder-line{
    position:absolute; top:42px; left:25px; right:25px;
    height:6px; background:var(--line); border-radius:999px; z-index:1;
  }
  .ladder-line-fill{
    height:100%; background:linear-gradient(90deg, #27ae60, #b5622a);
    border-radius:999px; transition:width .6s ease;
  }
  .ladder-node{
    position:relative; z-index:2; display:flex; flex-direction:column;
    align-items:center; text-align:center; width:80px;
  }
  .node-dot{
    width:24px; height:24px; border-radius:50%; background:var(--card);
    border:3px solid var(--line); transition:all .25s; margin-bottom:6px;
    display:flex; align-items:center; justify-content:center; font-size:.65rem; font-weight:700;
  }
  .ladder-node.passed .node-dot{
    border-color:var(--ok); background:var(--ok); color:#fff;
  }
  .ladder-node.active .node-dot{
    border-color:var(--accent); background:var(--accent); color:#fff;
    box-shadow:0 0 0 4px rgba(181,98,42,.25);
  }
  .node-name{font-weight:700; font-size:.82rem; color:var(--txt)}
  .node-chars{font-size:.72rem; color:var(--muted)}
  .ladder-pointer-tag{
    position:absolute; top:0; transform:translateX(-50%);
    background:var(--accent); color:#fff; padding:2px 8px; border-radius:6px;
    font-size:.72rem; font-weight:700; white-space:nowrap; transition:left .5s ease;
  }
  .ladder-pointer-tag::after{
    content:''; position:absolute; bottom:-4px; left:50%; transform:translateX(-50%);
    border-left:4px solid transparent; border-right:4px solid transparent;
    border-top:4px solid var(--accent);
  }

  .ascii-ladder-box{
    background:#2b2b2b; color:#f7f5f0; border-radius:12px;
    padding:14px 18px; font-family:monospace, "Courier New", Courier;
    font-size:.85rem; direction:ltr; text-align:left; overflow-x:auto;
    line-height:1.6; border:1px solid #444; margin-top:12px;
  }

  /* ═══ راية ترقية المستويات (Tier Banner) ═══ */
  .tier-banner{
    background:linear-gradient(135deg, #fff8ef, #fef4e8);
    border:2px dashed var(--accent); border-radius:18px;
    padding:18px 22px; margin-bottom:20px;
    display:flex; align-items:center; gap:16px; flex-wrap:wrap;
  }
  .tier-icon{font-size:2.8rem; line-height:1}
  .tier-info{flex:1; min-width:240px}
  .tier-title{margin:0 0 4px; font-size:1.15rem; color:var(--accent); font-weight:700}
  .tier-desc{margin:0; color:var(--txt); font-size:.9rem}

  .tier-tabs{
    display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap;
  }
  .tier-tab{
    background:var(--card); border:2px solid var(--line); border-radius:999px;
    padding:8px 18px; cursor:pointer; font-family:inherit; font-size:.9rem;
    font-weight:700; color:var(--muted); transition:all .2s;
  }
  .tier-tab:hover{border-color:var(--accent); color:var(--accent)}
  .tier-tab.active{
    border-color:var(--accent); background:var(--accent-bg); color:var(--accent);
    box-shadow:0 3px 10px rgba(181,98,42,.12);
  }

  /* أقسام */
  h2.section-title{
    font-size:1.2rem; color:var(--accent); margin:30px 0 14px;
    padding-right:12px; border-right:4px solid var(--accent);
    display:flex; align-items:center; gap:10px;
  }
  .count-badge{
    background:var(--accent-bg); color:var(--accent);
    border-radius:999px; padding:1px 10px; font-size:.8rem; font-weight:700;
  }

  /* شبكة الإنجازات */
  .achievements-grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(125px,1fr)); gap:14px;
  }
  .achievement{
    background:var(--card); border:1px solid var(--line);
    border-radius:16px; padding:14px 8px; text-align:center;
    transition:all .25s; position:relative;
  }
  .achievement.unlocked{
    border-color:var(--gold);
    box-shadow:0 4px 16px rgba(212,175,55,.15);
  }
  .achievement.locked{opacity:.55}
  .achievement.unlocked:hover{transform:translateY(-4px); box-shadow:0 8px 24px rgba(212,175,55,.25)}
  .emblem-svg{width:80px; height:80px; display:block; margin:0 auto}
  .achievement.locked .emblem-svg{filter:grayscale(1); opacity:.6}
  .achievement-name{font-size:.85rem; font-weight:700; margin-top:6px; color:var(--txt)}
  .achievement-desc{font-size:.72rem; color:var(--muted); margin-top:2px; line-height:1.3}

  /* إحصاءات */
  .stats-grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:12px;
  }
  .stat-card{
    background:var(--card); border:1px solid var(--line);
    border-radius:14px; padding:14px 12px; text-align:center;
  }
  .stat-val{font-size:1.6rem; font-weight:700; color:var(--accent); line-height:1.1}
  .stat-lbl{font-size:.8rem; color:var(--muted); margin-top:2px}

  /* المواجهة المباشرة */
  .head-to-head{
    background:var(--card); border:1px solid var(--line);
    border-radius:18px; padding:22px;
  }
  .h2h-row{
    display:grid; grid-template-columns:1fr auto 1fr; gap:14px;
    align-items:center; margin-bottom:14px; font-size:.9rem;
  }
  .h2h-row:last-child{margin-bottom:0}
  .h2h-bar{
    height:26px; border-radius:8px; background:var(--line);
    position:relative; overflow:hidden;
  }
  .h2h-fill{
    height:100%; transition:width .6s ease;
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-weight:700; font-size:.85rem;
  }
  .h2h-fill.p1{background:linear-gradient(90deg,#e67e22,#b5622a); border-radius:8px 0 0 8px}
  .h2h-fill.p2{background:linear-gradient(90deg,#3498db,#1f6699); border-radius:0 8px 8px 0}
  .h2h-bar.p2-wrap{direction:ltr}
  .h2h-label{font-weight:700; color:var(--muted); font-size:.75rem; white-space:nowrap; min-width:100px; text-align:center}
  .h2h-val{font-size:.85rem; font-weight:700; color:var(--txt)}

  /* سجل النشاط */
  .activity-list{
    background:var(--card); border:1px solid var(--line);
    border-radius:16px; padding:8px 16px;
  }
  .activity-item{
    display:flex; align-items:center; gap:12px;
    padding:10px 0; border-bottom:1px dashed var(--line); font-size:.9rem;
  }
  .activity-item:last-child{border-bottom:none}
  .activity-icon{font-size:1.4rem; min-width:30px; text-align:center}
  .activity-text{flex:1}
  .activity-time{color:var(--muted); font-size:.78rem}
  .empty-msg{text-align:center; color:var(--muted); padding:20px; font-size:.9rem}

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(80px);
    background:var(--gold); color:#2b2b2b; padding:12px 22px; border-radius:14px;
    font-weight:700; box-shadow:0 8px 24px rgba(0,0,0,.2);
    transition:transform .35s ease; z-index:1000; max-width:90vw; text-align:center;
  }
  .toast.show{transform:translateX(-50%) translateY(0)}
  footer{text-align:center; margin-top:36px; color:var(--muted); font-size:.82rem}
</style>
</head>
<body>
<a href="#main-content" class="skip-link">تخطي إلى المحتوى</a>

<main class="wrap" id="main-content">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; flex-wrap:wrap; gap:8px">
    <a href="index.html" class="back" style="margin-bottom:0">← الرئيسية</a>
    <div style="display:flex; gap:8px">
      <a href="map.html" class="btn" style="padding:6px 16px; border-radius:999px; font-size:.85rem; text-decoration:none">🗺️ خريطة المدن ←</a>
      <a href="daily.html" class="btn btn-primary" style="padding:6px 16px; border-radius:999px; font-size:.85rem; text-decoration:none">🔥 التحدي اليومي ←</a>
    </div>
  </div>

  <header>
    <h1>لوحة التقدم وسلّم HSK</h1>
    <p>تنافس مع أخيك، افتح أوسمة المستويات المتدرجة، واصعد سلّم الطلاقة الحقيقية</p>
  </header>

  <div class="profile-switcher" id="profile-switcher" role="region" aria-label="تبديل الملفات الشخصية"></div>

  <div class="profile-card">
    <div class="level-ring" id="level-ring"></div>
    <div class="profile-info">
      <h2 class="profile-name" id="profile-name" contenteditable="true" spellcheck="false" role="textbox" aria-label="اسم اللاعب" aria-multiline="false"></h2>
      <div class="profile-sub" id="profile-sub"></div>
      <div class="xp-bar" role="progressbar" aria-label="شريط نقاط الخبرة"><div class="xp-fill" id="xp-fill"></div></div>
      <div class="xp-label" id="xp-label"></div>
      <div style="margin-top:10px; display:flex; gap:8px; flex-wrap:wrap">
        <button class="profile-pill" style="padding:6px 12px; font-size:.85rem" id="btn-avatar" aria-label="تغيير صورة الأفاتار">تغيير الأفاتار</button>
      </div>
    </div>
  </div>

  <!-- ═══ بطاقة سلّم HSK ═══ -->
  <section class="ladder-card" id="hsk-ladder-card" role="region" aria-label="سلّم مستويات HSK ومحطات الطلاقة"></section>

  <!-- ═══ راية ترقية المستويات والأوسمة ═══ -->
  <div class="tier-banner" id="tier-banner"></div>

  <div class="tier-tabs" id="tier-tabs" role="tablist" aria-label="مستويات الأوسمة"></div>

  <h2 class="section-title">الأوسمة والإنجازات <span class="count-badge" id="ach-count">0/0</span></h2>
  <div class="achievements-grid" id="achievements-grid"></div>

  <h2 class="section-title">الإحصاءات</h2>
  <div class="stats-grid" id="stats-grid"></div>

  <h2 class="section-title">المواجهة المباشرة</h2>
  <div class="head-to-head" id="head-to-head"></div>

  <h2 class="section-title">آخر النشاطات</h2>
  <div class="activity-list" id="activity-list"></div>

  <footer>البيانات محفوظة في متصفحك — لا يُرسل شيء لأي مكان</footer>
</main>

<div class="toast" id="toast" aria-live="polite"></div>

<script>
(function(){
  const AVATARS = ['🐯','🦊','🐼','🦁','🐸','🐨','🦉','🐺','🦄','🐙','🐲','🦅'];
  let currentTierTab = 1;

  function escapeHTML(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    })[c]);
  }

  function timeAgo(ts){
    const d = Date.now() - ts;
    const min = Math.floor(d / 60000);
    if (min < 1) return 'الآن';
    if (min < 60) return `قبل ${min} د`;
    const hr = Math.floor(min / 60);
    if (hr < 24) return `قبل ${hr} س`;
    const day = Math.floor(hr / 24);
    if (day < 30) return `قبل ${day} ي`;
    return `قبل ${Math.floor(day/30)} ش`;
  }

  function emblemSVG(id, c1, c2, icon){
    return `<svg viewBox="0 0 100 100" class="emblem-svg" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="emb-${id}" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="${c1}"/>
          <stop offset="100%" stop-color="${c2}"/>
        </linearGradient>
      </defs>
      <circle cx="50" cy="50" r="46" fill="url(#emb-${id})" stroke="#fff" stroke-width="2.5"/>
      <circle cx="50" cy="50" r="40" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" stroke-dasharray="3 4"/>
      <text x="50" y="52" font-size="40" text-anchor="middle" dominant-baseline="middle">${icon}</text>
    </svg>`;
  }

  function renderProfileSwitcher(){
    const all = CNProgress.getAllProfiles();
    const current = CNProgress.getCurrentId();
    const box = document.getElementById('profile-switcher');
    box.innerHTML = Object.keys(all).map(id => {
      const p = all[id];
      const lv = CNProgress.levelFromXP(p.xp);
      return `<button class="profile-pill ${id === current ? 'active' : ''}" data-id="${id}">
        <span class="pill-avatar">${escapeHTML(p.avatar)}</span>
        <span class="pill-info">
          <div class="pill-name">${escapeHTML(p.name)}</div>
          <div class="pill-xp">المستوى ${lv} · ${p.xp} نقطة</div>
        </span>
      </button>`;
    }).join('');
    box.querySelectorAll('.profile-pill').forEach(b => {
      b.addEventListener('click', () => {
        CNProgress.setCurrentId(b.dataset.id);
        renderAll();
      });
    });
  }

  function renderProfileCard(){
    const p = CNProgress.getProfile();
    const lv = CNProgress.levelFromXP(p.xp);
    const prog = CNProgress.xpProgress(p.xp);
    const C = 2 * Math.PI * 50;
    const offset = C - (C * prog.percent / 100);

    document.getElementById('level-ring').innerHTML = `
      <svg viewBox="0 0 120 120">
        <circle cx="60" cy="60" r="50" fill="none" stroke="#e6e0d4" stroke-width="9"/>
        <circle cx="60" cy="60" r="50" fill="none" stroke="#b5622a" stroke-width="9"
          stroke-dasharray="${C}" stroke-dashoffset="${offset}" stroke-linecap="round"/>
      </svg>
      <div class="avatar-center">${escapeHTML(p.avatar)}</div>
      <div class="level-badge">المستوى ${lv}</div>
    `;

    const nameEl = document.getElementById('profile-name');
    if (nameEl.textContent !== p.name) nameEl.textContent = p.name;
    document.getElementById('profile-sub').textContent =
      `${p.achievements.length} إنجاز · ${p.stats.totalActivities} نشاط · ${p.stats.charsMastered || 36} حرفاً متقناً`;

    const fill = document.getElementById('xp-fill');
    fill.style.width = prog.percent + '%';
    document.getElementById('xp-label').innerHTML =
      `<b>${p.xp}</b> نقطة — المتبقي للمستوى ${lv + 1}: <b>${prog.total - prog.current}</b>`;
  }

  // ═══ رسم سلّم HSK ═══
  function renderHSKLadder(){
    const p = CNProgress.getProfile();
    const ladderData = CNProgress.getLadderProgress(p);
    const card = document.getElementById('hsk-ladder-card');

    const ladderNodes = ladderData.ladder;
    const count = ladderData.count;

    // حساب النسبة التقريبية للمؤشر على الشريط (0% إلى 100%)
    let percentOnTrack = 0;
    if (count <= 174) {
      percentOnTrack = (count / 174) * 16.6;
    } else if (count <= 347) {
      percentOnTrack = 16.6 + ((count - 174) / (347 - 174)) * 16.6;
    } else if (count <= 617) {
      percentOnTrack = 33.2 + ((count - 347) / (617 - 347)) * 16.6;
    } else if (count <= 1064) {
      percentOnTrack = 49.8 + ((count - 617) / (1064 - 617)) * 16.6;
    } else if (count <= 1685) {
      percentOnTrack = 66.4 + ((count - 1064) / (1685 - 1064)) * 16.6;
    } else if (count <= 2663) {
      percentOnTrack = 83.0 + ((count - 1685) / (2663 - 1685)) * 17.0;
    } else {
      percentOnTrack = 100;
    }
    percentOnTrack = Math.max(3, Math.min(97, percentOnTrack));

    // رسم العقد
    const nodesHtml = ladderNodes.map((item, idx) => {
      const isPassed = count >= item.chars;
      const isActive = ladderData.stageIndex === idx;
      const cls = isActive ? 'active' : (isPassed ? 'passed' : '');
      const numFmt = item.chars.toLocaleString('ar-EG');
      return `<div class="ladder-node ${cls}">
        <div class="node-dot">${isPassed ? '✓' : (idx + 1)}</div>
        <div class="node-name">${item.level}</div>
        <div class="node-chars">${item.chars.toLocaleString()}</div>
      </div>`;
    }).join('');

    card.innerHTML = `
      <div class="ladder-header">
        <h2 class="ladder-title">🧗‍♂️ سلّم الطلاقة ومستويات HSK</h2>
        <div class="ladder-badge">المرحلة الحالية: ${ladderData.currentStage.name} (${ladderData.currentStage.level})</div>
      </div>

      <div class="ladder-stats-row">
        <div class="ladder-stat">
          <div class="ladder-stat-val">${count} حرفاً</div>
          <div class="ladder-stat-lbl">الحروف المتقنة حالياً</div>
        </div>
        <div class="ladder-stat">
          <div class="ladder-stat-val">${ladderData.pctHSK1}%</div>
          <div class="ladder-stat-lbl">من الدرجة الأولى (HSK 1: 174 حرفاً)</div>
        </div>
        <div class="ladder-stat">
          <div class="ladder-stat-val">${ladderData.pctFluency}%</div>
          <div class="ladder-stat-lbl">من قمة السلّم (الطلاقة: 3,500+ حرفاً)</div>
        </div>
      </div>

      <div class="ladder-track-wrap">
        <div class="ladder-track">
          <div class="ladder-pointer-tag" style="left: ${percentOnTrack}%">▲ أنت هنا (${count} حرفاً)</div>
          <div class="ladder-line">
            <div class="ladder-line-fill" style="width: ${percentOnTrack}%"></div>
          </div>
          ${nodesHtml}
        </div>
      </div>

      <div class="ascii-ladder-box">
┌────────────────────────────────────────────────────────────────────────────────────────┐
│ HSK 1 ── HSK 2 ── HSK 3 ── HSK 4 ── HSK 5 ── HSK 6 ── الطلاقة                         │
│  174     347      617     1,064    1,685    2,663    3,500+                             │
│   ▲                                                                                    │
│   أنت هنا (${count} حرفاً) = ${ladderData.pctHSK1}% من الدرجة الأولى = ${ladderData.pctFluency}% من قمة السلّم              │
└────────────────────────────────────────────────────────────────────────────────────────┘
      </div>
    `;
  }

  // ═══ رسم الأوسمة والترقية بين المستويات (Tiers) ═══
  function renderTiersAndAchievements(){
    const p = CNProgress.getProfile();
    const all = CNProgress.getAchievements();
    const tierStatus = CNProgress.getTierStatus(p);
    const unlocked = new Set(p.achievements);

    // راية الترقية
    const banner = document.getElementById('tier-banner');
    if (tierStatus.tier1.complete && tierStatus.currentTier >= 2) {
      banner.innerHTML = `
        <div class="tier-icon">🎖️</div>
        <div class="tier-info">
          <div class="tier-title">🎉 مبارك! أتقنت المستوى الأول وترقيت إلى (المستوى الثاني: الباحث المتقدم)!</div>
          <div class="tier-desc">لقد فتحت بنجاح مجموعة الأوسمة والتحديات الجديدة. استمر في جمع حروف HSK والصعود في السلّم!</div>
        </div>
      `;
      banner.style.display = 'flex';
    } else {
      banner.innerHTML = `
        <div class="tier-icon">🌱</div>
        <div class="tier-info">
          <div class="tier-title">المرحلة الحالية: المستوى الأول (التأسيس)</div>
          <div class="tier-desc">أكملت <b>${tierStatus.tier1.unlocked}</b> من أصل <b>${tierStatus.tier1.total}</b> أوسمة. اجمع كافة أوسمة الأساس لفتح المستوى المتقدم وترقية رتبتك!</div>
        </div>
      `;
      banner.style.display = 'flex';
    }

    // تبويبات المستويات
    const tabs = document.getElementById('tier-tabs');
    tabs.innerHTML = `
      <button class="tier-tab ${currentTierTab === 1 ? 'active' : ''}" data-tier="1">
        🥉 المستوى الأول: الأساس (${tierStatus.tier1.unlocked}/${tierStatus.tier1.total})
      </button>
      <button class="tier-tab ${currentTierTab === 2 ? 'active' : ''}" data-tier="2">
        🥈 المستوى الثاني: المتقدم ${!tierStatus.tier1.complete ? '🔒' : `(${tierStatus.tier2.unlocked}/${tierStatus.tier2.total})`}
      </button>
      <button class="tier-tab ${currentTierTab === 3 ? 'active' : ''}" data-tier="3">
        🥇 المستوى الثالث: التنين ${!tierStatus.tier2.complete ? '🔒' : `(${tierStatus.tier3.unlocked}/${tierStatus.tier3.total})`}
      </button>
    `;

    tabs.querySelectorAll('.tier-tab').forEach(btn => {
      btn.addEventListener('click', () => {
        currentTierTab = parseInt(btn.dataset.tier, 10);
        renderTiersAndAchievements();
      });
    });

    // شبكة أوسمة المستوى المحدد
    const grid = document.getElementById('achievements-grid');
    const filtered = all.filter(a => a.tier === currentTierTab);

    document.getElementById('ach-count').textContent = `${unlocked.size}/${all.length}`;

    grid.innerHTML = filtered.map(a => {
      const isUnlocked = unlocked.has(a.id);
      return `<div class="achievement ${isUnlocked ? 'unlocked' : 'locked'}" title="${escapeHTML(a.desc)}">
        ${emblemSVG(a.id, ...a.colors, a.icon)}
        <div class="achievement-name">${escapeHTML(a.name)}</div>
        <div class="achievement-desc">${escapeHTML(isUnlocked ? 'مفتوح ✓' : a.desc)}</div>
      </div>`;
    }).join('');
  }

  function renderStats(){
    const p = CNProgress.getProfile();
    const s = p.stats;
    const acc = s.testsTotal > 0 ? Math.round((s.testsCorrect / s.testsTotal) * 100) : 0;
    const items = [
      ['الاختبارات', s.testsTaken],
      ['الدقة', acc + '%'],
      ['أفضل سلسلة', s.bestStreak + ' 🔥'],
      ['كلمات مسموعة', s.audioPlays],
      ['حروف مرسومة', s.charactersWritten],
      ['جولات كاملة', s.perfectRounds],
      ['الحروف المتقنة', (s.charsMastered || 36) + ' 📖']
    ];
    document.getElementById('stats-grid').innerHTML = items.map(([lbl, val]) =>
      `<div class="stat-card"><div class="stat-val">${val}</div><div class="stat-lbl">${lbl}</div></div>`
    ).join('');
  }

  function renderHeadToHead(){
    const all = CNProgress.getAllProfiles();
    const ids = Object.keys(all);
    if (ids.length < 2){
      document.getElementById('head-to-head').innerHTML =
        '<div class="empty-msg">يحتاج ملفان على الأقل للمقارنة</div>';
      return;
    }
    const p1 = all.p1, p2 = all.p2;
    const metrics = [
      { label:'النقاط',     get:p => p.xp,                         max: Math.max(p1.xp, p2.xp) || 1, fmt: v => v },
      { label:'المستوى',    get:p => CNProgress.levelFromXP(p.xp), max: Math.max(CNProgress.levelFromXP(p1.xp), CNProgress.levelFromXP(p2.xp)), fmt: v => v },
      { label:'حروف HSK',   get:p => (p.stats && p.stats.charsMastered) || 36, max: Math.max((p1.stats && p1.stats.charsMastered)||36, (p2.stats && p2.stats.charsMastered)||36), fmt: v => v + ' حرفاً' },
      { label:'الدقة',      get:p => p.stats.testsTotal ? Math.round(p.stats.testsCorrect / p.stats.testsTotal * 100) : 0, max: 100, fmt: v => v + '%' },
      { label:'أفضل سلسلة', get:p => p.stats.bestStreak,           max: Math.max(p1.stats.bestStreak, p2.stats.bestStreak) || 1, fmt: v => v + ' 🔥' },
      { label:'الإنجازات',  get:p => p.achievements.length,        max: Math.max(p1.achievements.length, p2.achievements.length) || 1, fmt: v => v }
    ];

    const html = metrics.map(m => {
      const v1 = m.get(p1), v2 = m.get(p2);
      const w1 = (v1 / m.max) * 100;
      const w2 = (v2 / m.max) * 100;
      return `<div class="h2h-row">
        <div class="h2h-bar"><div class="h2h-fill p1" style="width:${w1}%">${m.fmt(v1)}</div></div>
        <div class="h2h-label">${m.label}</div>
        <div class="h2h-bar p2-wrap"><div class="h2h-fill p2" style="width:${w2}%; margin-right:auto">${m.fmt(v2)}</div></div>
      </div>`;
    }).join('');

    document.getElementById('head-to-head').innerHTML = `
      <div style="display:flex; justify-content:space-between; margin-bottom:14px; font-size:.85rem; color:var(--muted)">
        <span style="color:#b5622a; font-weight:700">${escapeHTML(p1.name)} ${escapeHTML(p1.avatar)}</span>
        <span style="color:#1f6699; font-weight:700">${escapeHTML(p2.avatar)} ${escapeHTML(p2.name)}</span>
      </div>
      ${html}
    `;
  }

  function renderActivity(){
    const p = CNProgress.getProfile();
    const box = document.getElementById('activity-list');
    if (!p.activity.length){
      box.innerHTML = '<div class="empty-msg">لا نشاط بعد — ابدأ باختبار أو استماع أو كتابة</div>';
      return;
    }
    const labels = { test:'📝 اختبار', audio:'🎧 استماع', write:'✍️ كتابة', daily:'⭐ تحدي يومي' };
    box.innerHTML = p.activity.slice(0, 10).map(a => {
      let text = labels[a.type] || a.type;
      if (a.data && a.data.char) text += ` (${a.data.char})`;
      if (a.type === 'test' && a.data.total){
        text += ` — ${a.data.correct || 0}/${a.data.total}`;
      }
      return `<div class="activity-item">
        <div class="activity-icon">${(labels[a.type] || '•').split(' ')[0]}</div>
        <div class="activity-text">${escapeHTML(text)}</div>
        <div class="activity-time">${timeAgo(a.time)}</div>
      </div>`;
    }).join('');
  }

  function showToast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }

  function renderAll(){
    renderProfileSwitcher();
    renderProfileCard();
    renderHSKLadder();
    renderTiersAndAchievements();
    renderStats();
    renderHeadToHead();
    renderActivity();
  }

  // أحداث
  document.getElementById('profile-name').addEventListener('blur', (e) => {
    const newName = e.target.textContent.trim().slice(0, 20) || 'لاعب';
    CNProgress.updateProfile(p => { p.name = newName; });
    renderAll();
    showToast('تم حفظ الاسم');
  });

  document.getElementById('btn-avatar').addEventListener('click', () => {
    const p = CNProgress.getProfile();
    const idx = AVATARS.indexOf(p.avatar);
    const next = AVATARS[(idx + 1) % AVATARS.length];
    CNProgress.updateProfile(prof => { prof.avatar = next; });
    renderAll();
  });

  window.addEventListener('player-changed', renderAll);
  window.addEventListener('storage', e => {
    if (e.key === 'cn-learn-current-v1' || e.key === 'cn-learn-profiles-v1') renderAll();
  });

  renderAll();
})();
</script>
<script src="player-picker.js"></script>
</body>
</html>
